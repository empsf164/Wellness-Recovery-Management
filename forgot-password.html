<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — VERA Wellness & Recovery</title>
  <meta name="description" content="Reset your VERA account credentials safely and securely.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Core CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-primary); padding: 2rem 1rem;">

  <!-- Main Content Card -->
  <main style="width: 100%; max-width: 440px;">
    <div class="card card-warm" style="width: 100%; box-shadow: var(--shadow-lg); padding: 2.5rem 2rem;">
      
      <!-- Brand Top Center -->
      <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <a href="index.html" class="navbar-brand" style="justify-content: center;">
          <span class="brand-icon">V</span>
          <span>VERA</span>
        </a>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.4rem;">Reset Password</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 0;">
          Enter the email address associated with your VERA account and we'll send a secure recovery link.
        </p>
      </div>

      <div id="resetStatusMessage" style="display: none; margin-bottom: 1.5rem;"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="elena.rostova@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Send Reset Instructions</button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.88rem; color: var(--text-secondary);">
        Remember your password? <a href="login.html" style="color: var(--accent-sage); font-weight: 600;">Sign in</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
