<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — VERA Wellness & Recovery</title>
  <meta name="description" content="Create your private VERA account to organize routines, track recovery trends, and share progress securely.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Core CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-primary); padding: 2.5rem 1rem;">

  <!-- Signup Main Card -->
  <main style="width: 100%; max-width: 480px;">
    <div class="card card-warm" style="width: 100%; box-shadow: var(--shadow-lg); padding: 2.5rem 2rem;">
      
      <!-- Brand Top Center -->
      <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <a href="index.html" class="navbar-brand" style="justify-content: center;">
          <span class="brand-icon">V</span>
          <span>VERA</span>
        </a>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="section-tag" style="margin-bottom: 0.5rem;">Begin Your Practice</span>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.4rem;">Create Your Account</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 0;">A private, calm space for personal wellness reflection</p>
      </div>

      <form id="signupForm">
        <!-- Input fields in separate lines -->
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Elena Rostova" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="elena@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" class="form-control" placeholder="Create a password" required>
            <button type="button" class="password-toggle-btn" aria-label="Show password" tabindex="-1">
              <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-hide" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle-btn" aria-label="Show password" tabindex="-1">
              <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-hide" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Terms and Conditions Tickbox -->
        <div style="margin-top: 1.2rem; margin-bottom: 1.5rem;">
          <label class="custom-check-group" style="align-items: flex-start; gap: 0.6rem;">
            <input type="checkbox" id="agreeTerms" required checked>
            <span style="font-size: 0.85rem; line-height: 1.4; color: var(--text-secondary);">
              I agree to the <a href="about.html" class="auth-link">Terms and Conditions</a> and <a href="about.html" class="auth-link">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <!-- Bottom Google and Apple Social Sign-in -->
      <div style="display: flex; align-items: center; gap: 1rem; margin: 1.75rem 0 1.25rem 0;">
        <div style="flex: 1; height: 1px; background-color: var(--border-subtle);"></div>
        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">or sign up with</span>
        <div style="flex: 1; height: 1px; background-color: var(--border-subtle);"></div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
        <button type="button" class="btn btn-secondary" id="btnGoogleSignup"
          style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.88rem; padding: 0.65rem 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="btn btn-secondary" id="btnAppleSignup"
          style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.88rem; padding: 0.65rem 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.9.04-2 .6-2.64 1.36-.57.65-1.06 1.73-.93 2.76 1.02.08 2.05-.5 2.65-1.25z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="disclaimer-box" style="margin-top: 1.5rem; font-size: 0.8rem;">
        <svg class="disclaimer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <div>
          By signing up, you agree to our quiet, privacy-first terms. We never monetize or sell personal wellness data.
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" class="auth-link" style="font-weight: 600;">Sign in</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
